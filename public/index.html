<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="体育祭の試合速報・競技別トーナメント・総合順位をリアルタイムで確認できます。">
  <title>体育祭 2026 | スケジュール</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top-bar">
    <button id="menuButton" class="top-menu-btn" type="button" aria-label="メニューを開く" aria-controls="appMenu" aria-expanded="false">
      <span class="menu-lines" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div class="top-title">体育祭<span>2026</span></div>
    <div class="top-live" id="topLive">LIVE</div>
  </header>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <aside id="appMenu" class="app-menu" aria-label="メニュー" hidden>
    <div class="menu-heading"><strong>メニュー</strong><button id="menuClose" type="button" aria-label="閉じる">×</button></div>
    <nav class="menu-links">
      <button type="button" data-menu-tab="schedule">スケジュール</button>
      <button type="button" data-menu-tab="news">試合速報</button>
      <button type="button" data-menu-tab="bracket">トーナメント表</button>
      <button type="button" data-menu-tab="standings">総合順位</button>
      <button type="button" data-menu-tab="results">全試合結果</button>
    </nav>
    <p class="menu-note">試合結果は運営のGoogleスプレッドシートをもとに更新されます。<br>本サイトから結果を編集することはできません。</p>
  </aside>
  <main class="page-container">
    <div class="page-intro">
      <div class="eyebrow">SPORTS FESTIVAL · 2026</div>
      <h1 id="pageHeading">スケジュール</h1>
      <p id="pageDescription" class="intro-desc">12:30〜18:00の開催概要と各競技の予定です。</p>
    </div>
    <div id="connection" class="connection" role="status" aria-live="polite">
      <span class="connection-dot"></span><span id="connectionLabel">データ取得中…</span>
      <span id="updatedAt" class="connection-time"></span>
    </div>
    <div id="demoBanner" class="demo-banner" hidden>デモデータを表示中です。Google Sheets APIはまだ接続されていません。</div>
    <div id="alert" class="alert" role="alert" hidden></div>
    <section id="sportSelectorSection" class="section-selector" hidden>
      <h2 class="section-label">競技を選択</h2>
      <div id="sportButtons" class="sport-buttons" role="group" aria-label="競技の切り替え"></div>
    </section>
    <div id="view" aria-live="off">
      <section class="content-card"><p class="muted">読み込み中です…</p></section>
    </div>
    <footer class="page-footer">
      <p>体育祭 2026 ／ 試合情報</p>
      <p>表示データは運営の記録をもとにしています。最終的な判定は大会運営の発表を優先してください。</p>
    </footer>
  </main>
  <nav class="bottom-nav" aria-label="主要メニュー">
    <button type="button" class="bottom-item active" data-tab="schedule" aria-current="page">
      <span class="nav-icon" aria-hidden="true">▦</span><span>予定</span>
    </button>
    <button type="button" class="bottom-item" data-tab="news">
      <span class="nav-icon" aria-hidden="true">●</span><span>速報</span>
    </button>
    <button type="button" class="bottom-item" data-tab="bracket">
      <span class="nav-icon" aria-hidden="true">▤</span><span>対戦表</span>
    </button>
    <button type="button" class="bottom-item" data-tab="standings">
      <span class="nav-icon" aria-hidden="true">★</span><span>総合順位</span>
    </button>
    <button type="button" class="bottom-item" data-tab="results">
      <span class="nav-icon" aria-hidden="true">☷</span><span>全結果</span>
    </button>
  </nav>
</body>
</html>
