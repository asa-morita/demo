name: Validate tournament site
on:
  push:
    branches:
      - main
      - feat/sports-festival-live-brackets
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run deploy:check
